name: Pipeline CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      # Etape 1 : Prendre le code
      - name: Telecharger le code
        uses: actions/checkout@v4

      # Etape 2 : Installer Java
      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Etape 3 : Afficher les informations
      - name: Afficher les infos
        run: |
          echo "=== INFORMATIONS ==="
          echo "Utilisateur : ${{ github.actor }}"
          echo "Branche : ${{ github.ref }}"
          echo "Java version :"
          java --version
          echo ""
          echo "Maven version :"
          mvn --version

      # Etape 4 : Compiler le projet
      - name: Compiler
        run: mvn clean compile

      # Etape 5 : Executer les tests
      - name: Tests unitaires
        run: mvn test

      # Etape 6 : Resultats
      - name: Afficher resultats
        if: always()
        run: |
          echo "=== RESULTATS ==="
          if [ -f target/surefire-reports/com.exemple.CalculatorTest.txt ]; then
            echo "Rapport de tests :"
            cat target/surefire-reports/com.exemple.CalculatorTest.txt
          else
            echo "Aucun rapport trouve"
          fi

      # Etape 7 : Notifier en cas d'echec
      - name: Notifier echec
        if: failure()
        run: |
          echo "TESTS ECHOUES"
          echo "Veuillez corriger les erreurs"